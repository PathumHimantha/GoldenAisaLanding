name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment archive
        shell: bash
        run: |
          rm -rf .deploy-staging
          mkdir -p .deploy-staging
          rsync -a --delete --exclude .git --exclude .github ./ .deploy-staging/
          tar -czf deploy.tar.gz -C .deploy-staging .

      - name: Validate SSH secret
        shell: bash
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "SSH_KEY secret is missing. Add your private SSH key to GitHub repository secrets."
            exit 1
          fi

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 57.128.195.112 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 57.128.195.112
          username: ubuntu
          key_path: ~/.ssh/id_rsa
          source: deploy.tar.gz
          target: /tmp

      - name: Extract and deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 57.128.195.112
          username: ubuntu
          key_path: ~/.ssh/id_rsa
          script: |
            set -e
            echo "🚀 Deploying frontend files..."
            sudo mkdir -p /var/www/company-site
            sudo rm -rf /var/www/company-site/* /var/www/company-site/.[!.]* /var/www/company-site/..?* 2>/dev/null || true
            sudo tar -xzf /tmp/deploy.tar.gz -C /var/www/company-site
            sudo rm -f /tmp/deploy.tar.gz
            sudo chown -R www-data:www-data /var/www/company-site 2>/dev/null || true
            echo "✅ Frontend deployed successfully"
